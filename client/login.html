<html lang="tr">
  <head>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeuLeg Kütüphane — Giriş</title>
    <meta
      name="description"
      content="DarkTears kütüphanesine giriş yapın — kitap arama, rezervasyon ve kullanıcı işlemleri. Atatürk Üniversitesi öğrencilerine yönelik kütüphane arayüzü."
    />
    <meta
      name="keywords"
      content="library, zeuleg, dev, kütüphane, Atatürk Üniversitesi, kitap, rezervasyon, öğrenci, giriş, kullanıcı işlemleri,berkay,darktears,web development, frontend, html, css, javascript"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://library.zeuleg.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZeuLeg Kütüphane — Giriş" />
    <meta
      property="og:description"
      content="ZeuLeg kütüphanesine giriş yapın — kitap arama, rezervasyon ve kullanıcı işlemleri."
    />
    <meta property="og:url" content="https://library.zeuleg.dev/" />
    <meta property="og:image" content="./assets/images/visual-1.jpeg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DarkTears — Kütüphane Giriş" />
    <meta
      name="twitter:description"
      content="ZeuLeg kütüphanesine giriş yapın — kitap arama, rezervasyon ve kullanıcı işlemleri."
    />
    <meta name="twitter:image" content="./assets/images/visual-1.jpeg" />

    <!-- JSON-LD: Organization (genel site bilgisi) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ZeuLeg Library",
        "url": "https://library.zeuleg.dev/",
        "logo": "https://library.zeuleg.dev/assets/icons/favicon.svg",
        "sameAs": []
      }
    </script>

    <link rel="stylesheet" href="login.css" />
  </head>
  <body class="auth-page">
    <section class="auth-bg-slider" aria-hidden="true">
      <div class="auth-bg-track">
        <img src="./assets/images/visual-1.jpeg" alt="" />
        <img src="./assets/images/visual-2.jpeg" alt="" />
        <img src="./assets/images/visual-3.jpeg" alt="" />
        <img src="./assets/images/visual-4.jpeg" alt="" />
      </div>
    </section>

    <form class="login-card">
      <h1>Kutuphane Girisi</h1>
      <p class="subtitle">Hesabina erismek icin bilgilerini gir.</p>

      <div class="field">
        <label for="studentId">Ogrenci Kimlik ID</label>
        <input
          type="text"
          id="studentId"
          name="studentId"
          placeholder="Ornek: 230709074"
          pattern="^[0-9]{2}0709[0-9]{3}$"
          minlength="9"
          maxlength="9"
          inputmode="numeric"
          title="Ilk 2 hane giris yili, sonra 0709 sabit, son 3 hane degisebilir. Ornek: 250709095"
          required
        />
      </div>

      <div class="field">
        <label for="password">Sifre</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Sifren gir"
          minlength="6"
          title="Sifre en az 6 karakter olmalidir."
          required
        />
      </div>

      <div class="button-row">
        <input type="submit" value="Giris Yap" />
        <input type="reset" value="Temizle" />
      </div>
      <p class="auth-note">
        Hesabınız yok mu? <a href="kayıt.html">Kayıt olun</a>
      </p>
    </form>
  </body>
</html>
