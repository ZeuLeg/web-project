<!doctype html>
<html>
  <head>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="loginForm" class="login-card">
      <h1>Kütüphane Girişi</h1>
      <p class="subtitle">Hesabına erişmek için bilgilerini gir.</p>

      <div class="field">
        <label for="studentId">Öğrenci Numarası</label>
        <input
          type="text"
          id="studentId"
          name="studentId"
          pattern="^[0-9]{9}$"
          minlength="9"
          maxlength="9"
          inputmode="numeric"
          title="Öğrenci numarası tam olarak 9 haneli olmalıdır."
          required
        />
      </div>

      <div class="field">
        <label for="password">Şifre</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Şifreni gir"
          minlength="8"
          pattern="^(?=.*[A-Z]).{8,}$"
          title="Şifre en az 8 karakter olmalı ve en az 1 büyük harf içermelidir."
          required
        />
      </div>

      <div class="button-row">
        <input type="submit" value="Giriş Yap" />
        <input type="reset" value="Temizle" />
      </div>
      <p id="formMessage" class="form-message" aria-live="polite"></p>
      <a class="form-link" href="kayit.html">Hesabın yok mu? Kayıt ol</a>
    </form>
    <script src="giris.js"></script>
  </body>
</html>
