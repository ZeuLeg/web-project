<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kütüphane Randevu Sistemi</title>

    <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/global.css?v=20260504-kaanupdate" />
  </head>
  <body>
    <div
      class="announcement-bar index-static"
      aria-label="Kütüphane çalışma saati duyurusu"
    >
      <div class="announcement-track" id="homeAnnouncements">
        <span
          >Kütüphanemiz saat 09:00 ile 23:00 arasında hizmet vermektedir.</span
        >
      </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark py-3">
      <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="#"> Kütüphane</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-label="Menüyü aç"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a
                class="nav-link complaint-link fw-semibold"
                href="./pages/complaint.html"
                >Şikayet ve Öneri</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link announcement-link fw-semibold"
                href="./pages/notice.html"
                >Duyurular</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link contact-link fw-semibold"
                href="./pages/iletişim.html"
                >İletişim</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link complaint-link fw-semibold"
                href="./pages/books.html"
                >Kitap Al</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link contact-link fw-semibold"
                href="./pages/my-books.html"
                >Kitaplarım</a
              >
            </li>
            <li class="nav-item">
              <button
                id="logoutButton"
                class="nav-link logout-link fw-semibold"
                type="button"
              >
                Çıkış Yap
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="main-content container">
      <div class="photo-slider" aria-label="Kütüphane fotoğraf alanı">
        <div class="photo-track">
          <img src="./assets/images/library-1.jpg" alt="Kütüphane Görsel 1" />
          <img src="./assets/images/library-2.jpg" alt="Kütüphane Görsel 2" />
          <img src="./assets/images/library-3.jpg" alt="Kütüphane Görsel 3" />
        </div>
      </div>

      <div class="home-actions">
        <button
          class="btn btn-randevu text-white"
          onclick="location.href = './pages/desk-selection.html'"
        >
          Randevu Al
        </button>
        <button
          class="btn btn-randevu btn-randevularim text-white"
          onclick="location.href = './pages/reservations.html'"
        >
          Randevum
        </button>
      </div>
    </main>

    <footer class="footer">
      <div class="container fw-bold">TÜM HAKLAR SAKLIDIR | ZEDAKY</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/index-notices.js" defer></script>
    <script>
      const logoutButton = document.getElementById("logoutButton");

      logoutButton.addEventListener("click", async () => {
        logoutButton.disabled = true;

        try {
          await fetch("/api/logout", {
            method: "POST",
          });
        } catch (error) {
          // Sunucuya ulaşılamasa bile tarayıcıdaki oturum bilgilerini temizle.
        } finally {
          localStorage.removeItem("studentId");
          document.cookie =
            "studentId=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Lax";
          document.cookie =
            "studentId=; path=/api; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Lax";
          window.location.replace("./pages/login.html");
        }
      });
    </script>
  </body>
</html>
