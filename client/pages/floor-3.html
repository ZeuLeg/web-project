<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
    <title>Kat 3 - Masa Seçimi</title>
    <link rel="stylesheet" href="../css/desk.css" />
  </head>
  <body>
    <div class="booking-container">
      <div class="table-section">
        <a
          class="back-btn"
          href="../pages/desk-selection.html"
          style="text-decoration: none"
          >← Geri Dön</a
        >
        <h2>Kat 3 - Masa Seçimi ve Oturma Planı</h2>
        <p style="color: #666">Lütfen Kat 3 içinden boş bir koltuk seçin.</p>
        <div id="table-grid" class="table-grid"></div>
      </div>

      <div class="details-section">
        <h3 style="margin-top: 0">Randevu Detayları</h3>
        <div class="info-card">
          <p>Kat: <span>Kat 3</span></p>
          <p>Masa No: <span id="selected-desk-no">Henüz seçilmedi</span></p>
          <p>
            Seçilen Koltuk:
            <span id="selected-seat-text" style="color: #e74c3c"
              >Henüz seçilmedi</span
            >
          </p>
          <p>
            Durum: <span id="desk-status">Lütfen boş bir koltuk seçin</span>
          </p>
        </div>
        <button id="submit-btn" class="confirm-btn" disabled>
          Randevuyu Onayla
        </button>
      </div>
    </div>

    <script>
      const deskNoText = document.getElementById("selected-desk-no");
      const selectedSeatText = document.getElementById("selected-seat-text");
      const submitBtn = document.getElementById("submit-btn");
      const deskStatusText = document.getElementById("desk-status");
      const tableGrid = document.getElementById("table-grid");
      const floorNumber = 3;
      let selectedTableNo = null;
      let selectedSeatNo = null;

      function renderTablesForKat3() {
        tableGrid.innerHTML = "";

        for (let tableNo = 1; tableNo <= 15; tableNo++) {
          const wrapper = document.createElement("div");
          wrapper.className = "table-wrapper";

          const label = document.createElement("div");
          label.className = "table-label";
          label.innerText = "M-" + tableNo;
          wrapper.appendChild(label);

          for (let seatNo = 1; seatNo <= 4; seatNo++) {
            const seat = document.createElement("div");
            seat.className = "seat seat-" + seatNo;

            seat.classList.add("available");
            seat.innerText = seatNo + " - Boş";
            seat.addEventListener("click", () =>
              selectSeat(tableNo, seatNo, seat),
            );

            wrapper.appendChild(seat);
          }

          tableGrid.appendChild(wrapper);
        }
      }

      function selectSeat(tableNo, seatNumber, seatElement) {
        clearActiveSeats();
        seatElement.classList.add("active");
        selectedTableNo = tableNo;
        selectedSeatNo = seatNumber;

        deskNoText.innerText = "M-" + tableNo + " (Dörtlü Masa)";
        selectedSeatText.innerText = "Koltuk " + seatNumber;
        selectedSeatText.style.color = "#27ae60";
        deskStatusText.innerText = "Uygun, randevu alınabilir.";
        submitBtn.disabled = false;
      }

      function clearActiveSeats() {
        const allAvailableSeats = document.querySelectorAll(".seat.available");
        allAvailableSeats.forEach((seat) => {
          seat.classList.remove("active");
        });
      }

      async function confirmReservation() {
        const studentId = localStorage.getItem("studentId");

        if (!studentId) {
          deskStatusText.innerText =
            "Randevu almak için önce giriş yapmalısın.";
          deskStatusText.style.color = "#e74c3c";
          return;
        }

        if (!selectedTableNo || !selectedSeatNo) {
          deskStatusText.innerText = "Lütfen önce bir koltuk seçin.";
          deskStatusText.style.color = "#e74c3c";
          return;
        }

        submitBtn.disabled = true;
        deskStatusText.innerText = "Randevu kaydediliyor...";
        deskStatusText.style.color = "#222";

        try {
          const response = await fetch("/api/reservations", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              studentId,
              floor: floorNumber,
              deskNumber: selectedTableNo,
              seatNumber: selectedSeatNo,
            }),
          });
          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            deskStatusText.innerText = data.message || "Randevu kaydedilemedi.";
            deskStatusText.style.color = "#e74c3c";
            submitBtn.disabled = false;
            return;
          }

          deskStatusText.innerText = data.message || "Randevu kaydedildi.";
          deskStatusText.style.color = "#27ae60";
          window.location.href = "../pages/reservations.html";
        } catch (error) {
          deskStatusText.innerText =
            "Sunucuya bağlanılamadı. Lütfen tekrar deneyin.";
          deskStatusText.style.color = "#e74c3c";
          submitBtn.disabled = false;
        }
      }

      submitBtn.addEventListener("click", confirmReservation);
      renderTablesForKat3();
    </script>
  </body>
</html>
