<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body class="auth-page">
    <section class="auth-bg-slider" aria-hidden="true">
      <div class="auth-bg-track">
        <img src="../assets/images/visual-1.jpeg" alt="" />
        <img src="../assets/images/visual-2.jpeg" alt="" />
        <img src="../assets/images/visual-3.jpeg" alt="" />
        <img src="../assets/images/visual-4.jpeg" alt="" />
        <img src="../assets/images/visual-5.jpg" alt="" />
      </div>
    </section>

    <form id="loginForm" class="login-card">
      <h1>Kütüphane Girişi</h1>
      <p class="subtitle">Hesabına erişmek için bilgilerini gir.</p>

      <div class="field">
        <label for="studentId">Öğrenci Numarası</label>
        <input
          type="text"
          id="studentId"
          name="studentId"
          pattern="^[0-9]{9}$"
          minlength="9"
          maxlength="9"
          inputmode="numeric"
          title="Öğrenci numarası tam olarak 9 haneli olmalıdır."
          required
        />
      </div>

      <div class="field">
        <label for="password">Şifre</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder=""
          minlength="8"
          pattern="^(?=.*[A-Z]).{8,}$"
          title="Şifre en az 8 karakter olmalı ve en az 1 büyük harf içermelidir."
          required
        />
      </div>

      <div class="button-row">
        <input type="submit" value="Giriş Yap" />
        <input type="reset" value="Temizle" />
      </div>
      <p id="formMessage" class="form-message" aria-live="polite"></p>
      <p class="auth-note">
        Hesabınız yok mu? <a href="../pages/register.html">Kayıt olun</a>
      </p>
    </form>
    <script src="../js/login.js?v=20260504-kaanupdate"></script>
  </body>
</html>
