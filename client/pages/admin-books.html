<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- NOT: Aşağıdaki meta robots etiketi, sayfanın Google ve diğer arama motorları tarafından dizine eklenmesini ve linklerin takip edilmesini engeller. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — Kitaplar</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div class="sidebar">
      <h2>📚 Kütüphane Admin</h2>
      <ul>
        <li><a href="./admin-dashboard.html">📊 Dashboard</a></li>
        <li class="active">
          <a href="./admin-books.html">📖 Kitapları Yönet</a>
        </li>
        <li><a href="./admin-members.html">👥 Üyeler</a></li>
        <li><a href="./admin-loans.html">🔄 Ödünç İşlemleri</a></li>
        <li><a href="./admin-settings.html">⚙️ Ayarlar</a></li>
      </ul>
    </div>

    <div class="main-content">
      <div class="header">
        <div class="search-bar">
          <input type="text" placeholder="Kitap ara..." />
        </div>
        <div class="profile-area">
          <span>👤 Admin</span><button class="logout-btn">Çıkış</button>
        </div>
      </div>

      <main class="panel-container">
        <div class="panel-header">
          <h2>Kitap Listesi</h2>
          <button class="btn-add">+ Yeni Kitap Ekle</button>
        </div>

        <div class="toolbar">
          <div class="filters">
            <select id="categoryFilter">
              <option value="Tüm Kategoriler">Tüm Kategoriler</option>
              <option value="edebiyat">Edebiyat</option>
              <option value="yazilim">Yazılım</option>
              <option value="donanim">Donanım</option>
              <option value="siber">Siber Güvenlik</option>
            </select>
            <select id="statusFilter">
              <option value="Tüm Durumlar">Tüm Durumlar</option>
              <option value="Rafta">Rafta</option>
              <option value="Ödünçte">Ödünçte</option>
            </select>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>ISBN</th>
              <th>Kitap Adı</th>
              <th>Yazar</th>
              <th>Durum</th>
              <th>İşlemler</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </main>
    </div>
  </body>
  <script src="../js/admin-auth.js" defer></script>
  <script src="../js/admin-books.js" defer></script>
</html>
