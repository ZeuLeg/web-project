<!doctype html>
<!-- Sayfanin HTML5 belgesi oldugunu belirtir -->
<html lang="tr">
  <!-- Sayfa dilini Turkce olarak ayarlar -->
  <head>
    <!-- Baslik, stil ve meta bilgileri iceren bolum -->
    <meta charset="UTF-8" />
    <!-- Turkce karakterlerin dogru gorunmesini saglar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mobil cihazlarda duzgun olcekleme yapar -->
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
    <!-- Tarayici sekmesindeki ikon -->
    <title>Kat 1 - Masa Seçimi</title>
    <!-- Tarayici sekme basligi -->
    <link rel="stylesheet" href="../css/desk.css" />
    <!-- Bu sayfanin stil dosyasini baglar -->
  </head>
  <body>
    <!-- Kullaniciya gorunen icerigin baslangici -->

    <div class="booking-container">
      <!-- Sol tarafta masa plani, sag tarafta detay kartini tasiyan ana kutu -->
      <div class="table-section">
        <!-- Masa ve koltuk gorunumu alani -->
        <a
          class="back-btn"
          href="../pages/desk-selection.html"
          style="text-decoration: none"
          >← Geri Dön</a
        >
        <!-- Kat secim sayfasina geri donus -->
        <h2>Kat 1 - Masa Seçimi ve Oturma Planı</h2>
        <!-- Sayfa basligi -->
        <p style="color: #666">Lütfen Kat 1 içinden boş bir koltuk seçin.</p>
        <!-- Kisa yonlendirme metni -->
        <div id="table-grid" class="table-grid"></div>
        <!-- JavaScript ile masalarin olusturulacagi grid -->
      </div>

      <div class="details-section">
        <!-- Kullanici secimlerinin yazildigi sag panel -->
        <h3 style="margin-top: 0">Randevu Detayları</h3>
        <!-- Panel basligi -->
        <div class="info-card">
          <!-- Detay satirlarini tutan kart -->
          <p>Kat: <span>Kat 1</span></p>
          <!-- Sabit kat bilgisi -->
          <p>Masa No: <span id="selected-desk-no">Henüz seçilmedi</span></p>
          <!-- Secilen masa numarasi buraya yazilir -->
          <p>
            Seçilen Koltuk:
            <span id="selected-seat-text" style="color: #e74c3c"
              >Henüz seçilmedi</span
            >
          </p>
          <!-- Secilen koltuk bilgisi buraya yazilir -->
          <p>
            Durum: <span id="desk-status">Lütfen boş bir koltuk seçin</span>
          </p>
          <!-- Uygunluk durumu metni -->
        </div>
        <button id="submit-btn" class="confirm-btn" disabled>
          Randevuyu Onayla
        </button>
        <!-- Koltuk secilene kadar pasif onay butonu -->
      </div>
    </div>

    <script>
      <!-- Sayfadaki dinamik masa olusturma ve secim islemlerini yoneten JavaScript -->
      const deskNoText = document.getElementById("selected-desk-no"); // Masa numarasini gosteren span elemani
      const selectedSeatText = document.getElementById("selected-seat-text"); // Secilen koltuk metnini gosteren span
      const submitBtn = document.getElementById("submit-btn"); // Randevuyu onayla butonu
      const deskStatusText = document.getElementById("desk-status"); // Durum bilgisini gosteren span
      const tableGrid = document.getElementById("table-grid"); // Masa kutularinin cizilecegi ana grid
      const floorNumber = 1;
      let selectedTableNo = null;
      let selectedSeatNo = null;

      function renderTablesForKat1() {
        // Kat 1 icin tum masa ve koltuklari ekrana cizer
        tableGrid.innerHTML = ""; // Yeniden cizim oncesi eski icerigi temizler

        for (let tableNo = 1; tableNo <= 15; tableNo++) {
          // 1'den 15'e kadar masa olusturur
          const wrapper = document.createElement("div"); // Her masa icin kapsayici div
          wrapper.className = "table-wrapper"; // Masa kapsayici stil sinifi

          const label = document.createElement("div"); // Masanin ortasinda gorunen etiket
          label.className = "table-label"; // Etikete stil verir
          label.innerText = "M-" + tableNo; // Etikette masa numarasini yazar
          wrapper.appendChild(label); // Etiketi masa kapsayicisina ekler

          for (let seatNo = 1; seatNo <= 4; seatNo++) {
            // Her masa icin 4 koltuk olusturur
            const seat = document.createElement("div"); // Koltuk div'i olusturur
            seat.className = "seat seat-" + seatNo; // Koltugu konumlandiran siniflari ekler

            seat.classList.add("available"); // Bos koltuk gorunumu verir
            seat.innerText = seatNo + " - Boş"; // Koltuk metnini bos yapar
            seat.addEventListener("click", () =>
              selectSeat(tableNo, seatNo, seat),
            ); // Tiklaninca secim fonksiyonunu calistirir

            wrapper.appendChild(seat); // Koltugu ilgili masaya ekler
          }

          tableGrid.appendChild(wrapper); // Tamamlanan masayi grid alanina ekler
        }
      }

      function selectSeat(tableNo, seatNumber, seatElement) {
        // Kullanici bos koltuk sectiginde calisir
        clearActiveSeats(); // Daha once secilen koltuk vurgusunu temizler
        seatElement.classList.add("active"); // Yeni secilen koltugu vurgular
        selectedTableNo = tableNo;
        selectedSeatNo = seatNumber;

        deskNoText.innerText = "M-" + tableNo + " (Dörtlü Masa)"; // Secilen masa bilgisini yazar
        selectedSeatText.innerText = "Koltuk " + seatNumber; // Secilen koltuk bilgisini yazar
        selectedSeatText.style.color = "#27ae60"; // Secim yapildigini yesil renkle belirtir
        deskStatusText.innerText = "Uygun, randevu alınabilir."; // Durum metnini gunceller
        submitBtn.disabled = false; // Onay butonunu aktif eder
      }

      function clearActiveSeats() {
        // Tum bos koltuklardan aktif vurguyu kaldirir
        const allAvailableSeats = document.querySelectorAll(".seat.available"); // Bos koltuklari topluca secer
        allAvailableSeats.forEach((seat) => {
          // Her bos koltuk icin tek tek islem yapar
          seat.classList.remove("active"); // Aktif secim sinifini kaldirir
        });
      }

      async function confirmReservation() {
        const studentId = localStorage.getItem("studentId");

        if (!studentId) {
          deskStatusText.innerText =
            "Randevu almak için önce giriş yapmalısın.";
          deskStatusText.style.color = "#e74c3c";
          return;
        }

        if (!selectedTableNo || !selectedSeatNo) {
          deskStatusText.innerText = "Lütfen önce bir koltuk seçin.";
          deskStatusText.style.color = "#e74c3c";
          return;
        }

        submitBtn.disabled = true;
        deskStatusText.innerText = "Randevu kaydediliyor...";
        deskStatusText.style.color = "#222";

        try {
          const response = await fetch("/api/reservations", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              studentId,
              floor: floorNumber,
              deskNumber: selectedTableNo,
              seatNumber: selectedSeatNo,
            }),
          });
          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            deskStatusText.innerText = data.message || "Randevu kaydedilemedi.";
            deskStatusText.style.color = "#e74c3c";
            submitBtn.disabled = false;
            return;
          }

          deskStatusText.innerText = data.message || "Randevu kaydedildi.";
          deskStatusText.style.color = "#27ae60";
          window.location.href = "../pages/reservations.html";
        } catch (error) {
          deskStatusText.innerText =
            "Sunucuya bağlanılamadı. Lütfen tekrar deneyin.";
          deskStatusText.style.color = "#e74c3c";
          submitBtn.disabled = false;
        }
      }

      submitBtn.addEventListener("click", confirmReservation);
      renderTablesForKat1(); // Sayfa acildiginda Kat 1 masasini cizerek baslatir
    </script>
  </body>
  <!-- Sayfa govdesinin sonu -->
</html>
<!-- HTML belgesinin sonu -->
