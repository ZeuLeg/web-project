<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Şikayet ve Öneri - Kütüphane</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/complaint.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark py-3">
      <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="../index.html"> Kütüphane</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link back-link fw-semibold" href="../index.html"
                >⬅ Ana Sayfaya Dön</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link announcement-link fw-semibold"
                href="./notice.html"
                >Duyurular</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link contact-link fw-semibold"
                href="./iletişim.html"
                >İletişim</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link complaint-link fw-semibold" href="./books.html"
                >Kitap Al</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link contact-link fw-semibold"
                href="./my-books.html"
                >Kitaplarım</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="main-content container">
      <div class="glass-card">
        <h2 class="text-center mb-4 fw-bold">Şikayet ve Öneri Formu</h2>
        <p class="text-center text-light opacity-75 mb-4">
          Kütüphanemizi daha iyi hale getirmemiz için görüşleriniz bizim için
          çok önemli.
        </p>

        <form id="complaintForm" action="#" method="POST">
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="adSoyad" class="form-label">Adınız Soyadınız</label>
              <input
                type="text"
                class="form-control"
                id="adSoyad"
                name="fullName"
                placeholder="Ad Soyad"
                pattern="^[A-Za-zÇÖÜĞİçöüğı\s]{3,}$"
                title="Adınız yalnızca harf ve boşluk içermelidir (en az 3 karakter)."
                maxlength="80"
                required
              />
            </div>
            <div class="col-md-6 mt-3 mt-md-0">
              <label for="ogrenciNo" class="form-label"
                >Öğrenci Numaranız</label
              >
              <input
                type="text"
                class="form-control"
                id="ogrenciNo"
                name="studentId"
                placeholder="Örn: 230123456"
                pattern="^[0-9]{9}$"
                inputmode="numeric"
                title="Öğrenci numarası tam olarak 9 haneli olmalıdır."
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="konu" class="form-label">Konu</label>
            <select class="form-select" id="konu" name="topic" required>
              <option value="" selected disabled>
                Lütfen bir konu seçin...
              </option>
              <option value="gurultu">Gürültü / Ses Problemi</option>
              <option value="temizlik">Temizlik ve Hijyen</option>
              <option value="teknik">Teknik Arıza (Priz, İnternet vs.)</option>
              <option value="personel">Personel İletişimi</option>
              <option value="oneri">Genel Öneri</option>
              <option value="diger">Diğer</option>
            </select>
          </div>

          <div class="mb-4">
            <label for="mesaj" class="form-label">Mesajınız</label>
            <textarea
              class="form-control"
              id="mesaj"
              name="message"
              rows="5"
              placeholder="Lütfen karşılaştığınız durumu veya önerinizi detaylıca yazın..."
              minlength="10"
              maxlength="2000"
              required
            ></textarea>
          </div>

          <p
            id="complaintMessage"
            class="complaint-message"
            aria-live="polite"
          ></p>

          <button
            id="complaintSubmitButton"
            type="submit"
            class="btn btn-submit text-white"
          >
            Gönder
          </button>
        </form>
      </div>
    </main>

    <footer class="footer mt-auto">
      <div class="container fw-bold">TÜM HAKLAR SAKLIDIR | ZEDAKY</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const complaintForm = document.getElementById("complaintForm");
      const complaintMessage = document.getElementById("complaintMessage");
      const complaintSubmitButton = document.getElementById(
        "complaintSubmitButton",
      );

      function setComplaintMessage(text, type = "") {
        complaintMessage.textContent = text;
        complaintMessage.className =
          `complaint-message ${type ? `is-${type}` : ""}`.trim();
      }

      complaintForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!complaintForm.checkValidity()) {
          complaintForm.reportValidity();
          return;
        }

        complaintSubmitButton.disabled = true;
        complaintSubmitButton.textContent = "Gönderiliyor...";
        setComplaintMessage("Şikayetin e-posta olarak gönderiliyor...");

        try {
          const response = await fetch("/api/complaints", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              fullName: complaintForm.elements.fullName.value.trim(),
              studentId: complaintForm.elements.studentId.value.trim(),
              topic: complaintForm.elements.topic.value,
              message: complaintForm.elements.message.value.trim(),
            }),
          });
          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            setComplaintMessage(
              data.message || "Şikayetin gönderilemedi.",
              "error",
            );
            return;
          }

          setComplaintMessage(
            data.message || "Şikayetin başarıyla gönderildi.",
            "success",
          );
          complaintForm.reset();
        } catch (error) {
          setComplaintMessage(
            "Sunucuya bağlanılamadı. Lütfen tekrar deneyin.",
            "error",
          );
        } finally {
          complaintSubmitButton.disabled = false;
          complaintSubmitButton.textContent = "Gönder";
        }
      });
    </script>
  </body>
</html>
