<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" href="resimler/favicon/favicon1.png" type="image/png">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <form id="registerForm" class="login-card">
            <h1>Kütüphane Kaydı</h1>
            <p class="subtitle">Yeni hesap oluşturmak için bilgilerini gir.</p>

            <div class="field">
                <label for="tcId">TC Kimlik Numarası</label>
                <input type="text" id="tcId" name="tcId" pattern="^[0-9]{11}$" inputmode="numeric" title="TC Kimlik tam olarak 11 haneli olmalıdır." required>
            </div>

            <div class="field">
                <label for="studentId">Öğrenci Numarası</label>
                <input type="text" id="studentId" name="studentId" pattern="^[0-9]{9}$" minlength="9" maxlength="9" inputmode="numeric" title="Öğrenci numarası tam olarak 9 haneli olmalıdır." required>
            </div>

            <div class="field">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" minlength="8" pattern="^(?=.*[A-Z]).{8,}$" title="Şifre en az 8 karakter olmalı ve en az 1 büyük harf içermelidir." required>
            </div>

            <div class="button-row">
                <input type="submit" value="Kayıt Ol">
                <input type="reset" value="Temizle">
            </div>
            <p id="formMessage" class="form-message" aria-live="polite"></p>
            <a class="form-link" href="giris.html">Zaten hesabın var mı? Giriş yap</a>
        </form>
        <script src="kayit.js"></script>
    </body>
</html>
