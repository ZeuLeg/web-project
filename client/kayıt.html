<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <form class="login-card">
            <h1>Kutuphane Kayiti</h1>
            <p class="subtitle">Yeni hesap olustormak icin bilgilerini gir.</p>

            <div class="field">
                <label for="tcId">TC Kimlik Numarasi</label>
                <input type="text" id="tcId" name="tcId" placeholder="12345678901" pattern="^[0-9]{11}$" inputmode="numeric" title="TC Kimlik tam olarak 11 haneli olmalidir." required>
            </div>

            <div class="field">
                <label for="studentId">Ogrenci Kimlik ID</label>
                <input type="text" id="studentId" name="studentId" placeholder="Ornek: 230709089" pattern="^[0-9]{2}0709[0-9]{3}$" inputmode="numeric" title="Ilk 2 hane giris yili, sonra 0709 sabit, son 3 hane degisebilir. Ornek: 250709095" required>
            </div>

            <div class="field">
                <label for="password">Sifre</label>
                <input type="password" id="password" name="password" placeholder="Sifren gir" pattern="^[a-zA-Z0-9]{6,}$" title="Sifre en az 6 karakter olmalidir. Harf ve rakam icermelidir." required>
            </div>

            <div class="button-row">
                <input type="submit" value="Kayit Ol">
                <input type="reset" value="Temizle">
            </div>
        </form>
    </body>
</html>
