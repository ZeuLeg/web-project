server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index login.html;

    location = / {
        return 302 /pages/login.html;
    }

    location /api/ {
        proxy_pass http://api-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1. Çoklu Sayfa (MPA) ve Temiz URL Yönlendirmesi
    location / {
        # 1. Önce tam yolu dener ($uri)
        # 2. Sonra kök dizindeki .html versiyonunu dener ($uri.html -> indeks için)
        # 3. Bulamazsa, aranan dosyayı 'pages/' klasörü içinde arar (/pages$uri.html)
        # 4. Hiçbiri yoksa 404 fırlatır
        try_files $uri $uri.html /pages$uri.html $uri/ =404;
    }

    # 2. Performans Optimizasyonu (Önbellekleme)
    # Aktif geliştirme sırasında eski JS/CSS'in tarayıcıda uzun süre takılı kalmasını önler
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }
}
